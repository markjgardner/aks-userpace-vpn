# Allow ingress traffic to the web-frontend from the ingress controller.
# This enables public internet access to the web frontend via the Ingress resource.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-web-frontend
  namespace: app1
spec:
  podSelector:
    matchLabels:
      app: web-frontend
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
          protocol: TCP
