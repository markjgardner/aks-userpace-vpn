# Allow external UDP traffic to the WireGuard pod on port 51820.
# This enables VPN clients to connect from the public internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wireguard-external
  namespace: app1
spec:
  podSelector:
    matchLabels:
      app: wireguard
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 51820
          protocol: UDP
