apiVersion: apps/v1
kind: Deployment
metadata:
  name: wireguard
  namespace: app1
  labels:
    app: wireguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wireguard
  template:
    metadata:
      labels:
        app: wireguard
    spec:
      containers:
        - name: wireguard
          image: linuxserver/wireguard:1.0.20210914
          ports:
            - containerPort: 51820
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "UTC"
            - name: SERVERPORT
              value: "51820"
            - name: PEERS
              value: "user1"
            - name: PEERDNS
              value: "auto"
            - name: INTERNAL_SUBNET
              value: "10.13.13.0/24"
            - name: ALLOWEDIPS
              value: "10.13.13.0/24"
            # Set SERVERURL to the LoadBalancer's external IP or DNS name.
            # After deploying, retrieve it with:
            #   kubectl get svc wireguard -n app1 -o jsonpath='{.status.loadBalancer.ingress[0].ip}'
            # Then update this value or use 'auto' to attempt auto-detection.
            - name: SERVERURL
              value: "auto"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          volumeMounts:
            - name: wg-config
              mountPath: /config
            - name: host-modules
              mountPath: /lib/modules
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: wg-config
          persistentVolumeClaim:
            claimName: wireguard-config
        - name: host-modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wireguard-config
  namespace: app1
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: wireguard
  namespace: app1
  labels:
    app: wireguard
spec:
  type: LoadBalancer
  selector:
    app: wireguard
  ports:
    - port: 51820
      targetPort: 51820
      protocol: UDP
